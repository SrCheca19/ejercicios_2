<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 1 - Listas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2 class="titulo">lista no ordenada</h2>
  <ul class="no-ordenada">
    <li>opcion1</li>
    <li>opcion2
      <ul>
        <li>opcion21</li>
        <li>opcion22</li>
      </ul>
    </li>
    <li>opcion3</li>
    <li>opcion4</li>
    <li>opcion5</li>
  </ul>
  <hr>

  <h2 class="titulo">lista ordenada</h2>
  <ol class="ordenada">
    <li>opcion1</li>
    <li>opcion2
      <ul>
        <li>opcion21</li>
        <li>opcion22</li>
      </ul>
    </li>
    <li>opcion3</li>
    <li>opcion4
      <ol type="a">
        <li>opcion41
          <ol type="i">
            <li>opcion411</li>
            <li>opcion412</li>
          </ol>
        </li>
        <li>opcion42</li>
      </ol>
    </li>
    <li>opcion5</li>
  </ol>
  <hr>
</body>
</html>
